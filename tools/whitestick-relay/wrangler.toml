name = "whitestick-relay"
main = "build/worker/shim.mjs"
compatibility_date = "2025-10-01"
workers_dev = true

[build]
command = "cargo install -q worker-build && worker-build --release"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[observability]
enabled = true
