[package]
name = "clip"
version = "0.1.0"
edition = "2021"

# No third-party dependencies: this has to build on the render box's WSL side
# with no network and no vendoring, exactly like the rest of this workspace.
# `gbx` is a workspace member, not a dependency in that sense -- `clip overlay`
# draws a run's INPUT CHUNK, and the codec for that lives in `gbx` and must not
# be copied here. A second reader of the input packets is the bug this project
# has paid for most often.
[dependencies]
gbx = { path = "../gbx" }

[lib]
name = "clip"
path = "src/lib.rs"

[[bin]]
name = "clip"
path = "src/main.rs"

# The trainer's browser playtest lives here rather than in its own crate: it is
# the same job as `clip` -- drive an external binary that is absent on most
# boxes, and gate on what it produced -- and it reuses this crate's process and
# temp-dir plumbing verbatim. One member, one build.
[[bin]]
name = "playtest"
path = "src/bin/playtest.rs"
