[package]
name = "mk64"
version.workspace = true
edition = "2021"

[[bin]]
name = "mk64"
path = "src/main.rs"

[lib]
name = "mk64"
path = "src/lib.rs"

# `mapgeom` owns the item format (Solid2, collision, materials, DDS) and the
# map writer comes through it (`tmmaps`); mk64 only knows Mario Kart 64.
[dependencies]
mapgeom = { path = "../mapgeom" }
tmmaps = { path = "../tmmaps" }
# the ghost container (`ghost::record::rebuild_to`, `gbx::recwrite`) for the
# centreline ghosts (`mk64 ghost`)
ghost = { path = "../ghost" }
gbx = { path = "../gbx" }
