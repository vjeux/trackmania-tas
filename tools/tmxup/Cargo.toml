[package]
name = "tmxup"
version = "0.1.0"
edition = "2021"
description = "Drives the TMX (trackmania.exchange) upload form through a Chrome window on the render box over the DevTools protocol: one map per submission, the resulting page read back. Windows binary (talks to Chrome's loopback port); no upload API exists on TMX."

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 2
panic = "abort"

[workspace]
