[package]
name = "tmmaps"
version = "0.2.0"
edition = "2021"

[lib]
name = "tmmaps"
path = "src/lib.rs"

[[bin]]
name = "tmmaps"
path = "src/main.rs"

[dependencies]
# `tools/ghost` owns the ghost/replay format for the whole toolchain. tmmaps
# needs exactly one thing out of it -- the checkpoint splits a reference ghost
# declares -- and calls in for it rather than keeping a second reader.
ghost = { path = "../ghost" }
# Map NAMES are text before they are bytes: the ManiaPlanet markup and the XML
# escaping a title arrives wearing are decoded ONCE, in the format crate, so
# `tmmaps header` and `tmsite names` cannot disagree about what a map is called.
gbx = { path = "../gbx" }
