# tmserverctl configuration for ~/tmserver on the VPS fooo.
# Every key has a default (see `tmserverctl check`); this file only pins the ones that matter.
server_dir      = server                    # the unpacked Nadeo archive
dedicated_cfg   = dedicated_cfg.txt         # UserData/Config/
game_settings   = MatchSettings/lowg.txt    # UserData/Maps/
title           = Trackmania
lan             = false                     # true only for a local test without a server account
restart_delay_s = 5
log_max_mb      = 20
log_keep        = 5
bridge          = true                      # chat commands (/gravity, /bots, /collisions) -> LowG mode
