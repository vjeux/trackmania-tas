[package]
name = "resim"
version.workspace = true
edition = "2021"

[dependencies]
# The plain oracle, in process. `tmsearch validate` prints these same rows;
# parsing another program's stdout when the library is already a path
# dependency is how `tmtraj corpus dup` came back clean on a corrupt corpus.
ghost = { path = "../ghost" }
tmmaps = { path = "../tmmaps" }
gbx = { path = "../gbx" }
haul = { path = "../haul" }

[lib]
name = "resim"
path = "src/lib.rs"

[[bin]]
name = "tmresim"
path = "src/main.rs"
