[package]
name = "tmsearch"
version = "1.0.0"
edition = "2021"

[lib]
name = "tmsearch"
path = "src/lib.rs"

[[bin]]
name = "tmsearch"
path = "src/main.rs"

[dependencies]
# The file format, and the plain oracle. One definition of both, over there.
ghost = { path = "../../ghost" }
# The fork oracle, the watchdog, and the mutation operators -- shared with `fk`,
# which measures the watchdog's false-positive rate against this exact mix.
forkoracle = { path = "../forkoracle" }
# The telemetry decoder, for reading a reference line out of a recording. It is
# `gbx`: the record is part of the FORMAT, and tmtraj is the analysis above it.
gbx = { path = "../../gbx" }

