[package]
name = "tmexplore-engine"
version = "1.0.0"
edition = "2021"

# The adapters that bind the explorer to the real thing. Kept out of
# `tmexplore` so the search itself stays testable on a box with no game.
[dependencies]
tmexplore = { path = "../tmexplore" }
tmsearch = { path = "../tmsearch" }
forkoracle = { path = "../forkoracle" }
ghost = { path = "../../ghost" }
tmtraj = { path = "../../tmtraj" }
tmauto = { path = "../../tmauto" }
fk = { path = "../../fk/fk" }

[lib]
name = "tmexplore_engine"
path = "src/lib.rs"

[[bin]]
name = "tmexplore-real"
path = "src/main.rs"
