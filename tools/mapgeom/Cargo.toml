[package]
name = "mapgeom"
version.workspace = true
edition = "2021"

[[bin]]
name = "mapgeom"
path = "src/main.rs"

[lib]
name = "mapgeom"
path = "src/lib.rs"

# `tmmaps` owns `.Map.Gbx` for the whole toolchain -- blocks, items, both
# chunks, the free-block regime. mapgeom places what tmmaps reads; it does not
# keep a second map reader. `gbx` is the container (LZO, the chunk walk).
[dependencies]
tmmaps = { path = "../tmmaps" }
miniz_oxide = "0.9.1"
# the block icons are WEBP; an item icon the game reads (2026-09-22: a WEBP one
# copied into an item header read "icon none" in the inventory) is the raw
# 64x64 BGRA form the item editor writes, so the icons are decoded
image-webp = "0.2.4"
gbx = { path = "../gbx" }

