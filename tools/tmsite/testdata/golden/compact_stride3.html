const lst=document.getElementById('lst');
RUNS.forEach((r,i)=>{const tr=document.createElement('tr');tr.className='sel';
 tr.innerHTML='<td><span class=sw style="background:'+rc(i)+'"></span></td><td>'+r.name+
  '</td><td class=t>'+(r.time/1000).toFixed(3)+'</td>';
 tr.onmouseenter=()=>{hov=i;draw();};tr.onmouseleave=()=>{hov=-1;draw();};
 tr.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i);tr.className=sel.has(i)?'sel':'';draw();};
 lst.appendChild(tr);});
function setAll(f){sel=new Set(RUNS.map((_,i)=>i).filter(f));
 [...lst.children].forEach((tr,i)=>tr.className=sel.has(i)?'sel':'');draw();}
document.getElementById('ba').onclick=()=>setAll(()=>true);
document.getElementById('bn').onclick=()=>setAll(()=>false);
document.getElementById('bt').onclick=()=>setAll(i=>i<5);
document.getElementById('bs').onclick=e=>{cby='speed';e.target.className='on';
 document.getElementById('br').className='';draw();};
document.getElementById('br').onclick=e=>{cby='run';e.target.className='on';
 document.getElementById('bs').className='';draw();};
const xe=document.getElementById('xe');
xe.oninput=()=>{xex=+xe.value;document.getElementById('xl').textContent=xex+'x';draw();};
const ze=document.getElementById('ze');
ze.oninput=()=>{zex=+ze.value;document.getElementById('zl').textContent=zex+'x';draw();};
const tm=document.getElementById('tm'),tl=document.getElementById('tl');
tm.oninput=()=>{tcur=tm.value/1000;tl.textContent=(tcur*100).toFixed(0)+'%';draw();};
document.getElementById('rs').onclick=()=>{playing=false;tcur=-1;tm.value=0;
 tl.textContent='off';draw();};
document.getElementById('pl').onclick=()=>{playing=!playing;if(playing)tick();};
function tick(){if(!playing)return;tcur=(tcur<0?0:tcur)+0.005;if(tcur>1)tcur=0;
 tm.value=tcur*1000;tl.textContent=(tcur*100).toFixed(0)+'%';draw();
 requestAnimationFrame(tick);}
resize();
</script></body></html>
