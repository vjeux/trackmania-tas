[workspace]
resolver = "2"
# One crate per arm, each self-contained; the coordinator merges this list.
#   tmroute  (GEOM arm)  route/gate types + I/O + metrics + gates/human-orders/consensus
#   tmplan   (GEOM arm)  beam-search planner over a pluggable EdgeEstimator
#   tmreach  (GEN arm)   reachability dataset generator -- added on its branch
members = ["tmroute", "tmplan"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
